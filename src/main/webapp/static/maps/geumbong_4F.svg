<svg xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" viewBox="0 0 420 143" width="420" height="143" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- 금봉관 4층 배치도. data.sql의 place 사각형과 같은 값으로 그린 도면. 색은 style의 클래스로 바꾼다 -->
<style>
.fl{fill:#f1f3f4;stroke:#dadce0;stroke-width:1.5}
.room{transition:fill .15s}
.room--classroom{fill:#dce8fd}.room--special{fill:#d2e3fc}.room--office{fill:#fef7e0}
.room--toilet{fill:#e6f4ea}.room--hall{fill:#fafbfc}.room--etc{fill:#eceff1}
.room--stairs{fill:#e3e6e8}.room--stairs-v{fill:url(#stv)}.room--stairs-h{fill:url(#sth)}
.room--door{fill:#fde293}
.place:hover .room:not(.room--hall){fill:#aecbfa;cursor:pointer}
.lbl{font-weight:500;fill:#3c4043;text-anchor:middle;pointer-events:none}
</style>
<defs><pattern id="stv" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#eceff1"/><rect width="2.5" height="5" fill="#dadce0"/></pattern><pattern id="sth" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#eceff1"/><rect width="5" height="2.5" fill="#dadce0"/></pattern></defs>
<rect x="5" y="5" width="410" height="133" rx="8" class="fl"/>
<g class="place" data-place="복도" data-type="HALL"><rect class="room room--hall" x="92.3" y="49.5" width="166.3" height="12.4" rx="1.5"/>
</g>
<g class="place" data-place="복도" data-type="HALL"><rect class="room room--hall" x="231.9" y="37.8" width="26.7" height="11.8" rx="1.5"/>
</g>
<g class="place" data-place="복도" data-type="HALL"><rect class="room room--hall" x="402.3" y="113.6" width="8.2" height="19.1" rx="1.5"/>
</g>
<g class="place" data-place="과학실" data-type="SPECIAL"><rect class="room room--special" x="65.5" y="10.9" width="53.5" height="37.7" rx="1.5"/>
<text class="lbl" x="92.3" y="33.1" style="font-size:9.5px">과학실</text>
</g>
<g class="place" data-place="음악실" data-type="SPECIAL"><rect class="room room--special" x="120.8" y="27.5" width="54.3" height="21.1" rx="1.5"/>
<text class="lbl" x="148.0" y="41.4" style="font-size:9.5px">음악실</text>
</g>
<g class="place" data-place="준비실" data-type="ETC"><rect class="room room--etc" x="176.9" y="27.5" width="26.2" height="21.1" rx="1.5"/>
<text class="lbl" x="190.0" y="40.9" style="font-size:8.0px">준비실</text>
</g>
<g class="place" data-place="남직원 휴게실" data-type="OFFICE"><rect class="room room--office" x="204.9" y="27.5" width="26.1" height="21.1" rx="1.5"/>
<text class="lbl" x="218.0" y="36.1" style="font-size:7.9px">남직원</text>
<text class="lbl" x="218.0" y="45.6" style="font-size:7.9px">휴게실</text>
</g>
<g class="place" data-place="옥상(금봉관 4층)" data-type="ETC"><rect class="room room--etc" x="232.8" y="27.5" width="54.0" height="9.4" rx="1.5"/>
<text class="lbl" x="259.9" y="34.3" style="font-size:6.0px">옥상(금봉관 4층)</text>
</g>
<g class="place" data-place="계단" data-type="STAIRS"><rect class="room room--stairs-v" x="259.5" y="38.6" width="54.0" height="10.0" rx="1.5"/>
<text class="lbl" x="286.5" y="46.2" style="font-size:7.5px">계단</text>
</g>
<g class="place" data-place="옥상" data-type="ETC"><rect class="room room--etc" x="10.9" y="61.9" width="302.6" height="50.9" rx="1.5"/>
<text class="lbl" x="162.2" y="90.6" style="font-size:9.5px">옥상</text>
</g>
<g class="place" data-place="옥상" data-type="ETC"><rect class="room room--etc" x="259.5" y="50.4" width="54.0" height="11.5" rx="1.5"/>
</g>
<g class="place" data-place="과학준비실" data-type="ETC"><rect class="room room--etc" x="65.5" y="50.4" width="25.9" height="10.6" rx="1.5"/>
<text class="lbl" x="78.5" y="57.4" style="font-size:4.8px">과학준비실</text>
</g>
<g class="place" data-place="기타 공간" data-type="ETC"><rect class="room room--etc" x="315.3" y="81.4" width="18.3" height="31.3" rx="1.5"/>
<text class="lbl" x="324.5" y="95.0" style="font-size:8.4px">기타</text>
<text class="lbl" x="324.5" y="105.1" style="font-size:8.4px">공간</text>
</g>
</svg>