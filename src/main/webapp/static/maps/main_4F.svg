<svg xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" viewBox="0 0 352 99" width="352" height="99" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- 본관·실습동 4층 배치도. data.sql의 place 사각형과 같은 값으로 그린 도면. 색은 style의 클래스로 바꾼다 -->
<style>
.fl{fill:#f1f3f4;stroke:#dadce0;stroke-width:1.5}
.room{transition:fill .15s}
.room--classroom{fill:#dce8fd}.room--special{fill:#d2e3fc}.room--office{fill:#fef7e0}
.room--toilet{fill:#e6f4ea}.room--hall{fill:#fafbfc}.room--etc{fill:#eceff1}
.room--stairs{fill:#e3e6e8}.room--stairs-v{fill:url(#stv)}.room--stairs-h{fill:url(#sth)}
.room--door{fill:#fde293}
.place:hover .room:not(.room--hall){fill:#aecbfa;cursor:pointer}
.lbl{font-weight:500;fill:#3c4043;text-anchor:middle;pointer-events:none}
</style>
<defs><pattern id="stv" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#eceff1"/><rect width="2.5" height="5" fill="#dadce0"/></pattern><pattern id="sth" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#eceff1"/><rect width="5" height="2.5" fill="#dadce0"/></pattern></defs>
<rect x="5" y="5" width="342" height="89" rx="8" class="fl"/>
