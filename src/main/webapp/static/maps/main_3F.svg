<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="sans-serif">
  <!-- 임시 배치도 (본관 3층). 실제 배치도로 교체할 것. 영역 좌표는 data.sql의 place와 같다 -->
  <rect width="1200" height="600" fill="#fafafa"/>
  <text x="16" y="28" font-size="18" fill="#999">본관 3층 (임시 배치도)</text>
  <rect x="60" y="60" width="180" height="210" fill="#fff" stroke="#888" stroke-width="2" data-place="3-1반"/>
  <text x="150" y="170" font-size="14" text-anchor="middle" fill="#555">3-1반</text>
  <rect x="240" y="60" width="180" height="210" fill="#fff" stroke="#888" stroke-width="2" data-place="3-2반"/>
  <text x="330" y="170" font-size="14" text-anchor="middle" fill="#555">3-2반</text>
  <rect x="60" y="270" width="1080" height="60" fill="#fff" stroke="#888" stroke-width="2" data-place="3층 복도"/>
  <text x="600" y="305" font-size="14" text-anchor="middle" fill="#555">3층 복도</text>
</svg>
